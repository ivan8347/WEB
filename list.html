<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Списки</title>
    <style>
        ul, ol {
            list-style: none; /* убираем стандартные точки */
            padding-left: 0; /* убираем отступ, который даёт браузер */
        }

            ul li, ol li {
                padding-left: 20px; /* место под иконку: ширина + отступ справа */
                line-height: 20px; /* чтобы строка не схлопывалась, если картинка выше текста */
            }

                ul li::before, ol li::before {
                    content: "";
                    display: inline-block;
                    margin-right: 8px;
                    background-size: contain;
                    background-repeat: no-repeat;
                    vertical-align: middle;
                }

                ul li::before {
                    width: 16px;
                    height: 16px;
                    background-image: url("img/bitcoin.svg");
                }

                ol li::before {
                    width: 48px;
                    height: 48px;
                    background-image: url("img/single-2403253-1.png");
                }
    </style>


</head>
<body>

    <h1>Списки</h1>
    <h2>Маркированный список</h2>
    <ul>
        <li>Элемент 1 </li>
        <li>Элемент 2</li>
        <li>Элемент 3</li>
        <li>Элемент 4</li>
        <li>Элемент 5</li>
    </ul>
    <ol>
        <li>Элемент 1</li>
        <li>Элемент 2</li>
        <li>Элемент 3</li>
        <li>Элемент 4</li>
        <li>Элемент 5</li>
    </ol>

</body>
</html>
